[project]
name = "thunderbird-ai"
version = "0.1.0"
description = "Local AI companion app for Thunderbird."
readme = "README.md"
requires-python = "==3.13.*"
license = { file = "LICENSE.md" }
dependencies = [
  "fastapi==0.136.1",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
  "ty==0.0.34",
]

[build-system]
requires = ["uv_build==0.9.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "apps/api/src"
module-name = "thunderbird_ai_api"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/api/src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FA",
  "FAST",
  "FBT",
  "FIX",
  "I",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python = ".venv/bin/python"
python-version = "3.13"
root = ["apps/api/src", "tests"]

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
